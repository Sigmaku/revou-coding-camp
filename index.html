<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ===== GREETING SECTION ===== -->
    <header class="greeting-section">
      <div class="greeting-card">
        <div id="clock" class="clock">00:00:00</div>
        <div id="date" class="date">Monday, January 1, 2026</div>
        <div id="greeting" class="greeting">Good Morning</div>

        <!-- Challenge: Custom name in greeting -->
        <div class="name-wrapper">
          <span id="greeting-name" class="greeting-name"></span>
          <button id="btn-edit-name" class="btn-icon" title="Set your name">✏️</button>
        </div>


        <!-- Name input modal (hidden by default) -->
        <div id="name-modal" class="modal hidden">
          <div class="modal-box">
            <h3>What's your name?</h3>
            <input
              type="text"
              id="input-name"
              class="input-field"
              placeholder="Enter your name..."
              maxlength="30"
            />
            <div class="modal-actions">
              <button id="btn-save-name" class="btn btn-primary">Save</button>
              <button id="btn-cancel-name" class="btn btn-secondary">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content">

      <!-- ===== FOCUS TIMER SECTION ===== -->
      <section class="card timer-card">
        <h2 class="card-title">Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>

        <!-- Timer controls -->
        <div class="timer-controls">
          <button id="btn-start" class="btn btn-primary">Start</button>
          <button id="btn-stop" class="btn btn-secondary">Stop</button>
          <button id="btn-reset" class="btn btn-secondary">Reset</button>
        </div>

        <!-- Challenge: Change Pomodoro time -->
        <div class="timer-settings">
          <label for="timer-duration" class="settings-label">Set duration (minutes):</label>
          <input
            type="number"
            id="timer-duration"
            class="input-field input-small"
            min="1"
            max="120"
            value="25"
          />
          <button id="btn-set-duration" class="btn btn-secondary">Set</button>
        </div>
      </section>

      <!-- ===== TO-DO LIST SECTION ===== -->
      <section class="card todo-card">
        <h2 class="card-title">Tasks</h2>

        <!-- Add task input -->
        <div class="todo-input-row">
          <input
            type="text"
            id="input-task"
            class="input-field"
            placeholder="Add a new task..."
            maxlength="100"
          />
          <button id="btn-add-task" class="btn btn-primary">Add</button>
        </div>

        <!-- Task list -->
        <ul id="task-list" class="task-list">
          <!-- Tasks will be rendered here by JS -->
        </ul>

        <p id="empty-tasks" class="empty-message">No tasks yet. Add one above!</p>
      </section>

    </main>

    <!-- ===== QUICK LINKS SECTION ===== -->
    <section class="card links-card">
      <h2 class="card-title">Quick Links</h2>

      <!-- Add link input -->
      <div class="links-input-row">
        <input
          type="text"
          id="input-link-name"
          class="input-field"
          placeholder="Link name"
          maxlength="30"
        />
        <input
          type="url"
          id="input-link-url"
          class="input-field"
          placeholder="https://..."
          maxlength="200"
        />
        <button id="btn-add-link" class="btn btn-primary">Add Link</button>
      </div>

      <!-- Links list -->
      <div id="links-list" class="links-list">
        <!-- Quick link buttons will be rendered here by JS -->
      </div>

      <p id="empty-links" class="empty-message">No quick links yet. Add one above!</p>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
